name: test

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile scripts
        run: python -m py_compile project-handbook/scripts/*.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

  flow-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: python project-handbook/scripts/build_flow.py project-handbook/assets/flow.example.json flow-smoke
      - run: node tests/test_flow_browser.cjs flow-smoke/handbook.html
      - run: python project-handbook/scripts/build_flow.py project-handbook/assets/damage.example.json damage-smoke
      - run: node tests/test_damage_example_browser.cjs damage-smoke/handbook.html
      - name: In-page Q&A, interactions, search and reading aids
        run: |
          node tests/test_flow_assistant_browser.cjs
          node tests/test_flow_interactions.cjs
          node tests/test_flow_search.cjs
          node tests/test_flow_reader.cjs
          node tests/test_flow_model.cjs
          node tests/test_flow_any_agent.cjs
          node tests/test_flow_codebuddy_live.cjs
