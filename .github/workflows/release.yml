name: release

# Tag v* (for example v3.0.0) to publish project-handbook.zip, the package
# people upload to WorkBuddy or copy into another agent's skills folder.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the page template is current
        run: |
          python project-handbook/scripts/build_flow.py --viewer
          git diff --exit-code -- project-handbook/assets/viewer/handbook.html
      - name: Package
        run: |
          find project-handbook -name '__pycache__' -prune -exec rm -rf {} +
          zip -rq project-handbook.zip project-handbook -x '*.pyc' '*/.DS_Store'
          unzip -l project-handbook.zip | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: project-handbook
          path: project-handbook.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" project-handbook.zip --title "$GITHUB_REF_NAME" --generate-notes || gh release upload "$GITHUB_REF_NAME" project-handbook.zip --clobber
