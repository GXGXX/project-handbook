<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@@TITLE@@</title><style>@@CSS@@</style></head><body>
@@HEADER@@
@@NAV@@
<main><section id="diagram"><div class="heading"><div><h2 id="graph-title"></h2><p id="graph-note"></p></div><label>查找节点 <input id="search" placeholder="搜索流程或字段" type="search"></label></div><div class="legend"><span>实线箭头 → 执行顺序</span><span class="amber">判断框：按是 / 否选路</span><span>侧边处理后 → 回到主线</span><span>点击节点查看详情</span></div><p class="mobile-hint">图较宽时可左右滑动；公式单位和取整口径请查看对应节点。</p><div class="scroll"><div id="canvas"><svg id="edges" aria-label="执行连线"></svg><div id="nodes"></div></div></div><button id="next" class="next">入口看完了 → 继续看共同流程</button></section>
<section id="examples"><span class="eyebrow">沿数值验证理解</span><h2>跟着例子走一遍</h2><p>展开查看例子的输入、每一步变化与结果；演示与实测以例子标签为准。</p>@@EXAMPLES@@</section>
</main>
<dialog id="detail"><form method="dialog"><button class="close" aria-label="关闭">关闭 ×</button></form><span class="eyebrow">节点下钻</span><h2 id="detail-title"></h2><pre id="detail-formula"></pre><p id="detail-text"></p><details><summary>查看对应来源摘录</summary><pre id="source"></pre></details></dialog>
<script type="application/json" id="data">@@DATA@@</script><script>@@JS@@</script></body></html>
